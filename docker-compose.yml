services:

  flask:
    build: .
    container_name: flask_observability_app

    ports:
      - "5000:5000"

    environment:
      MYSQL_DB_URL: "mysql+pymysql://root:root@mysql:3306/hr_management"
      FLASK_SECRET_KEY: "docker-compose-secret-key"
      FLASK_HOST: "0.0.0.0"
      FLASK_PORT: "5000"

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - app-network


  mysql:
    image: mysql:9.7.2
    container_name: mysql_observability_db

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: hr_management

    ports:
      - "3307:3306"

    volumes:
      - mysql-data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-proot"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - app-network


  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro

    depends_on:
      - flask

    networks:
      - app-network


  grafana:
    image: grafana/grafana:latest
    container_name: grafana

    ports:
      - "3001:3000"

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"

    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro

    depends_on:
      - prometheus
      - loki
      - tempo

    networks:
      - app-network


  loki:
    image: grafana/loki:3.0.0
    container_name: loki

    ports:
      - "3100:3100"

    command:
      - -config.file=/etc/loki/local-config.yaml

    networks:
      - app-network


  promtail:
    image: grafana/promtail:3.0.0
    container_name: promtail

    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./promtail-config.yml:/etc/promtail/config.yml:ro

    command:
      - -config.file=/etc/promtail/config.yml

    depends_on:
      - loki

    networks:
      - app-network


  tempo:
    image: grafana/tempo:2.5.0
    container_name: tempo

    user: "0"

    command:
      - -config.file=/etc/tempo.yaml

    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/tmp/tempo

    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"

    networks:
      - app-network


volumes:

  mysql-data:

  grafana-data:

  tempo-data:


networks:

  app-network: