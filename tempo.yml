server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
        http:

ingester:
  trace_idle_period: 10s
  max_block_bytes: 1_000_000
  max_block_duration: 5m

compactor:
  compaction:
    compaction_window: 1h
    max_block_bytes: 100_000_000
    block_retention: 1h
    compacted_block_retention: 10m

# ---------- Metrics Generator ----------
metrics_generator:
  registry:
    external_labels:
      source: tempo
      cluster: docker

  storage:
    path: /tmp/tempo/generator/wal

    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true

  traces_storage:
    path: /tmp/tempo/generator/traces

  processor:
    service_graphs: {}
    span_metrics: {}

storage:
  trace:
    backend: local

    local:
      path: /tmp/tempo/blocks

    wal:
      path: /tmp/tempo/wal

overrides:
  defaults:
    metrics_generator:
      processors:
        - service-graphs
        - span-metrics

# Helps with single-binary ring issues
memberlist:
  abort_if_cluster_join_fails: false

querier:
  max_concurrent_queries: 20